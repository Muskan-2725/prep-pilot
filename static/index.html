<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrepPilot V1</title><link rel="stylesheet" href="/static/style.css"></head><body><header><b>PrepPilot</b><span id="nav">Adaptive GATE CSE mentor</span></header><main><section id="auth" class="hero"><p class="eyebrow">EVIDENCE-BASED STUDY SYSTEM</p><h1>Learn. Measure.<br>Adapt.</h1><p>PrepPilot turns each practice attempt into a visible next step.</p><div class="card"><label>Email<input id="email" type="email" aria-label="Email"></label><label>Password<input id="password" type="password" aria-label="Password" placeholder="10+ characters"></label><button onclick="signup()">Create account</button><button class="secondary" onclick="login()">Log in</button><p id="status" role="status"></p></div></section><section id="onboarding" hidden><h1>Set your starting point</h1><div class="card form"><label>Target<input id="target" value="Qualify confidently"></label><label>Exam date<input id="examDate" type="date"></label><label>Weekly study hours<input id="hours" type="number" value="8" min="2" max="80"></label><p>How confident are you today? (0–100)</p><label>Deadlocks<input id="deadlocks" type="number" value="50" min="0" max="100"></label><label>Scheduling<input id="scheduling" type="number" value="50" min="0" max="100"></label><label>Transactions<input id="transactions" type="number" value="50" min="0" max="100"></label><label>Graphs<input id="graphs" type="number" value="50" min="0" max="100"></label><button onclick="saveOnboarding()">Build my starting point</button></div></section><section id="app" hidden><nav><button onclick="loadDashboard()">Dashboard</button><button onclick="showPlan()">Plan</button><button onclick="showPractice()">Practice</button><button onclick="showMentor()">Mentor</button><button onclick="showProfile()">Profile</button><button class="secondary" onclick="logout()">Log out</button></nav><div id="view" aria-live="polite"></div></section></main><script src="/static/app.js"></script></body></html>
