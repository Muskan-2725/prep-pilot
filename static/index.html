<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrepPilot</title><link rel="stylesheet" href="/static/style.css"></head><body><header><b>PrepPilot</b><span>Adaptive GATE CSE mentor</span></header><main><section class="hero"><p class="eyebrow">RESEARCH-GROUNDED STUDY SYSTEM</p><h1>Prepare with evidence,<br>not just prompts.</h1><p>Plan, practise, diagnose, and adapt—one focused learning loop.</p></section><section id="auth" class="card"><h2>Start your pilot</h2><input id="email" placeholder="Email" type="email"><input id="password" placeholder="Password (10+ characters)" type="password"><button onclick="signup()">Create account</button><button class="secondary" onclick="login()">Log in</button><p id="status"></p></section><section id="app" hidden><div class="card"><h2>Your GATE CSE cockpit</h2><label>Weekly hours <input id="hours" type="number" value="8" min="2" max="80"></label><button onclick="onboard()">Save learning profile</button><button onclick="plan()">Generate adaptive plan</button><pre id="output"></pre></div><div class="grid"><div class="card"><h2>Mentor</h2><input id="message" placeholder="I don't understand deadlocks"><button onclick="mentor()">Ask mentor</button></div><div class="card"><h2>Practice</h2><button onclick="practice()">Get recommended question</button></div><div class="card"><h2>Research</h2><button onclick="research()">Check official sources</button></div></div></section></main><script src="/static/app.js"></script></body></html>
